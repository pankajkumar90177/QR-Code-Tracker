<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scan Logs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f7fb;
        }

        h1 {
            color: #222;
        }

        .table-container {
            overflow-x: auto;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #222;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            margin-bottom: 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .dashboard {
            background: #6f42c1;
        }
    </style>

</head>

<body>

    <h1>QR Scan Logs</h1>

    <a class="btn dashboard" href="/dashboard">
        Back to Dashboard
    </a>

    <div class="table-container">

        <table>

            <tr>
                <th>ID</th>
                <th>QR ID</th>
                <th>Scanned At</th>
                <th>IP Address</th>
                <th>Device / Browser</th>
            </tr>

            {% for log in scan_logs %}

            <tr>
                <td>{{ log[0] }}</td>
                <td>{{ log[1] }}</td>
                <td>{{ log[2] }}</td>
                <td>{{ log[3] }}</td>
                <td>{{ log[4] }}</td>
            </tr>

            {% endfor %}

        </table>

    </div>

</body>

</html>
