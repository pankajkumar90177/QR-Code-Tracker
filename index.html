<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Tracker - Generate QR</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            background: #007bff;
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #222;
            margin: 0;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 8px 0 25px;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            margin: 5px;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        .dashboard {
            background: #6f42c1;
        }

        .history {
            background: #007bff;
        }

        .logout {
            background: #dc3545;
        }

        .form-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #218838;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                margin: 10px auto;
                padding: 25px 18px;
            }

            h1 {
                font-size: 25px;
            }

            .nav {
                display: grid;
                grid-template-columns: 1fr;
            }

            .btn {
                text-align: center;
                margin: 4px 0;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            QR
        </div>

        <h1>QR Code Tracker</h1>

        <div class="subtitle">
            Generate and Track QR Codes
        </div>

        <div class="nav">

            <a class="btn dashboard" href="/dashboard">
                Dashboard
            </a>

            <a class="btn history" href="/history">
                QR History
            </a>

            <a class="btn logout" href="/logout">
                Logout
            </a>

        </div>

        <div class="form-title">
            Generate New QR Code
        </div>

        <form action="/generate" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Enter Name"
                required
            >

            <input
                type="text"
                name="data"
                placeholder="Enter Data / Mobile / ID"
                required
            >

            <button type="submit">
                Generate QR Code
            </button>

        </form>

        <div class="footer">
            QR Tracker System
        </div>

    </div>

</body>

</html>
